name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate AKBP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard public references
        run: make guard

      - name: Run tests
        run: make test

      - name: Run CLI smoke flow
        run: make smoke

      - name: Run retrieval benchmarks
        run: make benchmark

      - name: Run install smoke flow
        run: make install-smoke
