<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AKBP banner</title>
  <desc id="desc">Agent Knowledge Base Protocol banner showing agent sessions becoming durable, cited project knowledge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="120" x2="1100" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1100" cy="78" r="260" fill="#2563EB" opacity="0.18"/>
  <circle cx="106" cy="536" r="280" fill="#22C55E" opacity="0.12"/>
  <path d="M92 496C270 386 392 388 556 446C720 504 872 558 1192 388" stroke="url(#accent)" stroke-width="3" opacity="0.55"/>

  <g filter="url(#shadow)">
    <rect x="72" y="74" width="1136" height="492" rx="30" fill="#0B1220" opacity="0.84" stroke="#263244"/>
  </g>

  <text x="112" y="154" fill="#93C5FD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="0.14em">AGENT KNOWLEDGE BASE PROTOCOL</text>
  <text x="112" y="235" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="70" font-weight="800">Stop re-deriving.</text>
  <text x="112" y="314" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="70" font-weight="800">Start compiling.</text>
  <text x="116" y="372" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26">A local-first protocol for durable, cited, review-gated agent memory.</text>

  <g transform="translate(112 430)">
    <rect x="0" y="0" width="196" height="58" rx="16" fill="#111827" stroke="#334155"/>
    <text x="26" y="37" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700">transcripts</text>
    <path d="M214 29H272" stroke="#64748B" stroke-width="3"/>
    <path d="M260 18L274 29L260 40" stroke="#64748B" stroke-width="3" fill="none"/>

    <rect x="292" y="0" width="196" height="58" rx="16" fill="#111827" stroke="#334155"/>
    <text x="329" y="37" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700">claims</text>
    <path d="M506 29H564" stroke="#64748B" stroke-width="3"/>
    <path d="M552 18L566 29L552 40" stroke="#64748B" stroke-width="3" fill="none"/>

    <rect x="584" y="0" width="196" height="58" rx="16" fill="#111827" stroke="#334155"/>
    <text x="622" y="37" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700">evidence</text>
    <path d="M798 29H856" stroke="#64748B" stroke-width="3"/>
    <path d="M844 18L858 29L844 40" stroke="#64748B" stroke-width="3" fill="none"/>

    <rect x="876" y="0" width="196" height="58" rx="16" fill="#111827" stroke="#334155"/>
    <text x="912" y="37" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="20" font-weight="700">context</text>
  </g>

  <rect x="112" y="520" width="202" height="2" fill="#38BDF8"/>
  <rect x="326" y="520" width="202" height="2" fill="#818CF8"/>
  <rect x="540" y="520" width="202" height="2" fill="#22C55E"/>
</svg>
