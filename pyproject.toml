[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akbp"
version = "0.1.0"
description = "Reference CLI for the Agent Knowledge Base Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rohit Ghumare"}]
keywords = ["agents", "knowledge-base", "memory", "protocol", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/rohitg00/akbp"
Repository = "https://github.com/rohitg00/akbp"
Issues = "https://github.com/rohitg00/akbp/issues"

[project.scripts]
akbp = "akbp:main"
akbp-tool-server = "akbp_tool_server:main"

[tool.setuptools]
py-modules = ["akbp", "akbp_tool_server"]

[tool.setuptools.package-dir]
"" = "cli"
